<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة استخراج الشهادة الدراسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182634; --navy:#12324A; --navy-deep:#0B2233; --teal:#1F6B63;
    --gold:#B4913F; --gold-soft:#DCC48A; --paper:#FBF8F1; --paper-line:#E4DCC8;
    --muted:#5C6B78; --danger:#9A3B33;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 600px at 20% -10%, #163A55 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 110%, #0E2A40 0%, transparent 55%),
      var(--navy-deep);
    min-height:100vh; font-family:'Tajawal', sans-serif; color:var(--ink);
    display:flex; align-items:flex-start; justify-content:center;
    padding:48px 16px 80px;
  }
  .wrap{width:100%; max-width:640px;}
  .letterhead{display:flex; align-items:center; gap:14px; padding:0 4px 22px; color:#EDE7D8;}
  .seal{width:46px;height:46px;border-radius:50%; border:2px solid var(--gold-soft);
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
    background:radial-gradient(circle at 35% 30%, #1D4A66, #0F2A3D);}
  .seal svg{width:22px;height:22px;stroke:var(--gold-soft);}
  .letterhead-text{line-height:1.5;}
  .letterhead-text .org{font-family:'Markazi Text', serif; font-size:22px; font-weight:600; color:#F4EFE0;}
  .letterhead-text .sub{font-size:12.5px; color:#9FB2C0; letter-spacing:.3px;}
  .card{background:var(--paper); border:1px solid var(--paper-line); border-radius:6px;
    box-shadow: 0 30px 60px -20px rgba(4,15,25,.55); overflow:hidden;}
  .card-top{padding:34px 34px 26px; border-bottom:1px solid var(--paper-line);
    background: linear-gradient(180deg, rgba(180,145,63,.06), transparent 70%); position:relative;}
  .card-top::after{content:""; position:absolute; right:34px; bottom:0; left:34px; height:1px;
    background:linear-gradient(90deg, var(--gold-soft), transparent 80%);}
  h1{font-family:'Markazi Text', serif; font-size:29px; margin:0 0 6px; color:var(--navy); font-weight:700;}
  .lead{margin:0; color:var(--muted); font-size:14.5px; line-height:1.9; max-width:46ch;}
  form{padding:30px 34px 8px;}
  label{display:block; font-size:13.5px; font-weight:700; color:var(--navy); margin-bottom:8px;}
  .hint{font-weight:400; color:var(--muted); font-size:12.5px;}
  .field-row{display:flex; gap:10px;}
  input#civilId{flex:1; font-family:'Tajawal', sans-serif; font-size:18px; letter-spacing:2px;
    padding:13px 16px; border:1.5px solid #CBBFA0; border-radius:4px; background:#fff;
    color:var(--ink); outline:none; transition:border-color .15s ease, box-shadow .15s ease;}
  input#civilId::placeholder{letter-spacing:1px; color:#A9A290; font-weight:400;}
  input#civilId:focus{border-color:var(--teal); box-shadow:0 0 0 3px rgba(31,107,99,.15);}
  button#submitBtn{font-family:'Tajawal', sans-serif; font-size:15px; font-weight:700; color:#F6F1E4;
    background:var(--navy); border:none; border-radius:4px; padding:0 26px; cursor:pointer;
    transition:background .15s ease, transform .05s ease;}
  button#submitBtn:hover{background:var(--teal);}
  button#submitBtn:active{transform:translateY(1px);}
  button#submitBtn:disabled{background:#9AA6AE; cursor:default;}
  .error-msg{display:none; margin-top:12px; padding:10px 14px; border-radius:4px;
    background:#FBEAE8; border:1px solid #E3B9B3; color:var(--danger); font-size:13.5px;}
  .card-foot{padding:18px 34px 26px; font-size:12px; color:#9AA0A6; text-align:center;}
  #result{display:none;}
  .cert{margin:26px 34px 30px; border:1.5px solid var(--gold); border-radius:4px; padding:2px;
    background:linear-gradient(135deg, var(--gold-soft), var(--gold));}
  .cert-inner{background:#FFFDF7; border:1px solid #EFE4C6; border-radius:2px; padding:34px 28px;
    text-align:center; position:relative;}
  .cert-inner::before, .cert-inner::after{content:""; position:absolute; top:10px; bottom:10px; width:6px;
    background-image: repeating-linear-gradient(180deg, var(--gold-soft) 0 3px, transparent 3px 8px);}
  .cert-inner::before{right:10px;} .cert-inner::after{left:10px;}
  .cert-eyebrow{font-size:12px; color:var(--teal); font-weight:700; letter-spacing:.5px;}
  .cert-title{font-family:'Markazi Text', serif; font-size:24px; color:var(--navy); margin:6px 0 4px;}
  .cert-id{color:var(--muted); font-size:13.5px; margin-bottom:22px;}
  .open-btn{display:inline-flex; align-items:center; gap:8px; font-family:'Tajawal'; font-size:15px;
    font-weight:700; color:#F6F1E4; background:var(--navy); border:none; border-radius:4px;
    padding:13px 28px; cursor:pointer; text-decoration:none;}
  .open-btn:hover{background:var(--teal);}
  .cert-actions{margin-top:18px;}
  .btn-ghost{font-family:'Tajawal'; font-size:13.5px; font-weight:700; color:var(--muted);
    background:transparent; border:1.5px solid #D8D2C0; border-radius:4px; padding:9px 18px; cursor:pointer;}
  @media (max-width:480px){
    .card-top, form, .card-foot{padding-left:20px; padding-right:20px;}
    .cert{margin-left:16px; margin-right:16px;}
    .field-row{flex-direction:column;}
    button#submitBtn{padding:13px; width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="letterhead">
    <div class="seal">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l8 4-8 4-8-4 8-4z"></path>
        <path d="M4 11v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"></path>
      </svg>
    </div>
    <div class="letterhead-text">
      <div class="org">بوابة الخدمات التعليمية</div>
      <div class="sub">استخراج الشهادات الدراسية إلكترونياً</div>
    </div>
  </div>

  <div class="card">
    <div class="card-top">
      <h1>استخراج شهادتك الدراسية</h1>
      <p class="lead">أدخل رقمك المدني في الحقل أدناه، وسيظهر لك رابط شهادتك مباشرة.</p>
    </div>

    <form id="certForm">
      <label for="civilId">الرقم المدني</label>
      <div class="field-row">
        <input type="text" id="civilId" inputmode="numeric" maxlength="9" placeholder="مثال: 25124275" autocomplete="off">
        <button type="submit" id="submitBtn">استخراج الشهادة</button>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div id="result">
      <div class="cert">
        <div class="cert-inner">
          <div class="cert-eyebrow">تم العثور على الشهادة</div>
          <div class="cert-title">شهادة الطالب</div>
          <div class="cert-id" id="outId">الرقم المدني: —</div>
          <a class="open-btn" id="openLink" href="#" target="_blank" rel="noopener">فتح / تحميل الشهادة</a>
          <div class="cert-actions">
            <button type="button" class="btn-ghost" id="newSearchBtn">بحث جديد</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card-foot">جميع الشهادات محفوظة بشكل آمن على Google Drive</div>
  </div>
</div>

  const form = document.getElementById('certForm');
  const input = document.getElementById('civilId');
  const errorMsg = document.getElementById('errorMsg');
  const result = document.getElementById('result');
  const submitBtn = document.getElementById('submitBtn');
  const openLink = document.getElementById('openLink');

  input.addEventListener('input', () => {
    input.value = input.value.replace(/[^0-9]/g, '').slice(0, 9);
  });

  document.getElementById('newSearchBtn').addEventListener('click', () => {
    result.style.display = 'none';
    input.value = '';
    input.focus();
    errorMsg.style.display = 'none';
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    const id = input.value.trim();

    if (id.length < 6) {
      errorMsg.textContent = 'الرجاء إدخال رقم مدني صحيح.';
      errorMsg.style.display = 'block';
      result.style.display = 'none';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'جارِ البحث…';

    setTimeout(() => {
      submitBtn.disabled = false;
      submitBtn.textContent = 'استخراج الشهادة';

      const fileId = CERT_INDEX[id];
      if (!fileId) {
        errorMsg.textContent = 'لم يتم العثور على شهادة مرتبطة بهذا الرقم المدني. تأكد من الرقم وحاول مجدداً.';
        errorMsg.style.display = 'block';
        result.style.display = 'none';
        return;
      }

      document.getElementById('outId').textContent = 'الرقم المدني: ' + id;
      openLink.href = 'https://drive.google.com/file/d/' + fileId + '/view';
      result.style.display = 'block';
      result.scrollIntoView({behavior:'smooth', block:'nearest'});
    }, 400);
  });
</script>
